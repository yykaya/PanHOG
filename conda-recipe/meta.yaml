{% set name = "panhog" %}
{% set version = "0.3.0" %}

package:
  name: {{ name }}
  version: {{ version }}

# Build directly from this checkout so `conda build conda-recipe/` works out of
# the box. To build a released version instead, comment this out and use the
# PyPI/GitHub source block below (fill in the matching sha256).
source:
  path: ..
# source:
#   url: https://github.com/yykaya/PanHOG/archive/refs/tags/v{{ version }}.tar.gz
#   sha256: <sha256 of the release tarball>

build:
  number: 0
  noarch: python
  script: {{ PYTHON }} -m pip install . --no-deps --no-build-isolation -vv
  entry_points:
    - panhog = PanHOG:main
    - pangenehog = PangeneHOG:main

requirements:
  host:
    - python >=3.8
    - pip
    - setuptools >=61
  run:
    - python >=3.8
    - numpy
    - pandas
    - matplotlib-base
    - seaborn
    - biopython >=1.80
    - pyyaml
    - scipy            # dN/dS YN00 / ML substitution models
    # External bioinformatics tools invoked by PanHOG:
    - blast            # functional annotation (blastp/makeblastdb)
    - mafft            # protein alignment for Ka/Ks and supermatrix
    - muscle           # alternative aligner
    - pal2nal          # codon back-translation (optional)
    - paml             # codeml engine for --kaks-method codeml

test:
  imports:
    - panhog_dnds
  commands:
    - panhog --help
    - pangenehog --help

about:
  home: https://github.com/yykaya/PanHOG
  license: MIT
  license_family: MIT
  license_file: LICENSE
  summary: Phylogeny-Aware Pangenome Classification Toolkit
  description: |
    PanHOG is a phylogeny-aware toolkit for classifying and annotating
    Hierarchical Orthologous Groups (HOGs) in pangenomic datasets. It provides
    pangenome classification, codon-based dN/dS (Ka/Ks) selection analysis,
    phylogenetic LCA analysis, supermatrix generation, functional annotation,
    and publication-quality visualizations.
  dev_url: https://github.com/yykaya/PanHOG

extra:
  recipe-maintainers:
    - yykaya
